[package]
license = "Apache-2.0"
name = "ccode-shell"
version = "0.2.111"
edition.workspace = true

[features]
default = []
unstable = []
dhat-heap = ["dep:dhat"]
default-bazel = []

[dependencies]
dunce = { workspace = true }
tonic-prost = { workspace = true, optional = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
ccode-announcements = { workspace = true }
ccode-prompt = { workspace = true }
ccode-version = { workspace = true }

async-openai = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bm25 = "2.3"
bytes = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
kanal = "0.1"
regex = { workspace = true }
# rmcp 2.1 + reqwest 0.13 are quarantined inside `ccode-mcp`. The remaining
# MCP code in this crate (extensions/mcp.rs, mcp_doctor.rs) reaches rmcp model
# types via `ccode_mcp::rmcp::model::*`. reqwest 0.13 is a private impl
# detail of ccode-mcp::servers; shell never sees it. Every HTTP call site
# in this crate uses workspace reqwest 0.12.
ccode-mcp = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
reqwest-middleware = { workspace = true }
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2) with FTS5.
# Bumped from 0.32 to resolve CVE-2025-29087, CVE-2025-3277, CVE-2025-6965.
# sqlite-vec is C ABI, not Rust-version dependent — any rusqlite with `bundled` works.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
similar = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
dirs = "6"
tokio-stream = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
obfstr = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tokio-retry = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
ccode-acp = { workspace = true }
ccore = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
backon = { workspace = true }
webbrowser = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-native-certs = "0.8"
futures-util = { workspace = true }
urlencoding = { workspace = true }
gethostname = { workspace = true }
gcloud-storage = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
nucleo = { workspace = true }
arc-swap = { workspace = true }
infer = "0.15"
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
moka = { workspace = true, features = ["future"] }
dhat = { workspace = true, optional = true }
base64 = { workspace = true }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sha2 = { workspace = true }
rand = { workspace = true }
shlex = { workspace = true }
strum = { workspace = true }
ccode-worktree = { path = "../ccode-worktree", features = ["metadata"] }

tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
ccode-paths = { path = "../ccode-paths" }
ccode-shell-base = { workspace = true }
ccode-shell-session-support = { workspace = true }
ccode-shared = { workspace = true }
ccode-tracing = { workspace = true }
ccode-fsnotify = { path = "../ccode-fsnotify" }
ccode-graph = { path = "../ccode-graph" }
ccode-hunk = { path = "../ccode-hunk" }
ccode-lifecycle = { workspace = true }
ccode-interjection = { workspace = true }
ccode-sandbox = { path = "../ccode-sandbox", default-features = false }
ccode-chat = { path = "../ccode-chat" }
ccode-compaction = { path = "../../common/ccode-compaction" }
ccode-sampler = { path = "../ccode-sampler" }
ccode-journal = { workspace = true }
ccode-tokens = { workspace = true }
ccode-sampling-types = { path = "../ccode-sampling-types" }
ccode-tools = { path = "../ccode-tools" }
ccode-tty = { workspace = true }
ccode-workflow = { path = "../ccode-workflow" }
ccode-power = { workspace = true }
ccode-workspace = { workspace = true }
ccode-subagent = { path = "../ccode-subagent" }
ccode-agent = { path = "../ccode-agent" }
ccode-config = { workspace = true }
ccode-config-types = { workspace = true }
ccode-memory = { workspace = true }
ccode-hooks = { path = "../ccode-hooks" }
ccode-hooks-types = { path = "../ccode-hooks-types" }
ccode-marketplace = { path = "../ccode-marketplace" }
ccode-fs = { path = "../ccode-fs" }
ccode-auth = { workspace = true, features = ["middleware"] }
ccode-telemetry = { workspace = true }
ccode-http = { workspace = true }
ccode-models = { workspace = true }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
flate2 = { workspace = true }
fs2 = { workspace = true }
zstd = { workspace = true }
tar = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
tdigests = "1.0"
semver = { workspace = true }
process-wrap = { version = "9.0.0", features = ["tokio1", "job-object", "creation-flags"] }
portable-pty = "0.9"
parking_lot.workspace = true
dashmap.workspace = true

# Used by acp_session.rs and mcp_servers.rs for the unified
# ccode_tool_runtime::Tool dispatch model and the computer-hub MCP adapter.
ccode-hub-sdk = { workspace = true }
ccode-tool-runtime = { workspace = true }
ccode-tool-protocol = { workspace = true }
ccode-tool-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
siphasher = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
filetime = { workspace = true }
tempfile = { workspace = true }
ccode-memory = { workspace = true, features = ["test-support"] }
ccode-workspace = { workspace = true, features = ["test-support"] }
ccode-config = { workspace = true, features = [] }
ring = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
rsa = { workspace = true }
semver = { workspace = true }
serial_test = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
ccode-shell-base = { workspace = true, features = ["test-support"] }
ccode-test-support = { workspace = true, features = [] }
ccode-test-utils = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = { workspace = true, features = ["test-util"] }

[dependencies.tempfile]
workspace = true

[[bench]]
name = "session_list"
harness = false

[lints]
workspace = true
[build-dependencies]
# build.rs only downloads ripgrep — no rmcp involvement. Workspace reqwest
# (0.12) is plenty.
reqwest = { workspace = true, features = ["blocking"] }
flate2 = { workspace = true }
tar = { workspace = true }
[[bin]]
name = "chat-history-downgrade"
path = "src/bin/chat-history-downgrade.rs"
