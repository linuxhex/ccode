[package]
name = "ccore"
version = "0.1.0"
edition = "2021"
description = "ccode 核心库 - 消息总线驱动的终端 AI 编程代理"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dashboard = ["axum", "tower", "tower-http"]

[dependencies]
# 异步运行时
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = { workspace = true }

# TUI 渲染
ratatui = { workspace = true }
crossterm = { workspace = true }

# 消息总线 - 纯 Rust ZMTP 实现
zeromq = { version = "0.4", features = ["tokio-runtime", "tcp-transport", "ipc-transport"] }

# 异步 trait
async-trait = { workspace = true }

# 字节处理
bytes = { workspace = true }

# HTTP 客户端（Provider 适配器）
reqwest = { workspace = true }

# 序列化
rmp-serde = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 日志
tracing = { workspace = true }

# UUID
uuid = { workspace = true, features = ["v4", "serde"] }

# 时间
chrono = { workspace = true, features = ["serde"] }

# 配置
toml = { workspace = true }

# FFI
libc = "0.2"

# A+ 增强依赖
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
crossbeam-queue = "0.3"
notify = "6"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# 仿生架构依赖
regex = "1"

# URL 编码（WebSearch 工具）
urlencoding = { workspace = true }

# Git 支持
git2 = "0.20"

# 哈希
blake3 = { workspace = true }

# 压缩管道（snip + budget）
ccode-compaction = { path = "../../common/ccode-compaction" }

# Dashboard HTTP 服务器
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"

[[test]]
name = "tool_chain"
path = "tests/integration/tool_chain.rs"

[[test]]
name = "memory_lifecycle"
path = "tests/integration/memory_lifecycle.rs"

[[test]]
name = "error_handling"
path = "tests/integration/error_handling.rs"
