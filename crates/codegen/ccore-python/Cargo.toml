[package]
name = "ccore-python"
version = "0.1.0"
edition = "2024"
description = "Python bindings for ccore via PyO3"

[lib]
name = "ccore_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
serde_json = "1"
anyhow = "1"
