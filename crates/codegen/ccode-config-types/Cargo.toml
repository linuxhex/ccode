[package]
license = "Apache-2.0"
name = "ccode-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the ccode CLI, extracted from ccode-shell for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
ccode-announcements = { workspace = true }
ccode-config = { workspace = true }
ccode-mcp = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
