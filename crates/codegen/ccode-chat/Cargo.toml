[package]
license = "Apache-2.0"
name = "ccode-chat"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for ccode agents"

[features]
default-bazel = []

[dependencies]
indexmap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
ccode-compaction = { path = "../../common/ccode-compaction" }
ccode-sampling-types = { path = "../ccode-sampling-types" }
ccode-tokens = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
