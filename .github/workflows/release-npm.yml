# ============================================================================
# ccode npm 多平台构建 + 发布
# 触发条件：推送 v* 标签时自动构建 4 个平台二进制并发布到 npm
# 安全：npm 包仅包含编译后的二进制，不泄露源码
# ============================================================================
name: Release to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0）'
        required: true

jobs:
  # -------------------- 构建所有平台二进制 --------------------
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            pkg: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ripgrep (for ccode-tools build script)
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install ripgrep
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
          echo "CCODE_TOOLS_BUNDLE_RG_PATH=$(which rg)" >> $GITHUB_ENV

      - name: Install Linux ARM cross-compiler
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build ccode binary
        run: cargo build --release -p ccode-cli --target ${{ matrix.target }}

      - name: Prepare npm package
        run: |
          mkdir -p npm-pkg/bin
          cp target/${{ matrix.target }}/release/ccode npm-pkg/bin/ccode
          chmod +x npm-pkg/bin/ccode
          cp npm/${{ matrix.pkg }}/package.json npm-pkg/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccode-${{ matrix.pkg }}
          path: npm-pkg/

  # -------------------- 发布到 npm --------------------
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "ver=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "ver=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Update package versions
        run: |
          VER="${{ steps.version.outputs.ver }}"
          echo "Publishing version: ${VER}"

          # 更新所有 package.json 版本号
          for dir in npm/*/; do
            if [ -f "${dir}package.json" ]; then
              sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"${VER}\"/" "${dir}package.json"
            fi
          done

          # 更新主包 optionalDependencies
          sed -i "s/\"@ccode-ai\/cli-darwin-arm64\": \"[0-9.]*\"/\"@ccode-ai\/cli-darwin-arm64\": \"${VER}\"/" npm/ccode-cli/package.json
          sed -i "s/\"@ccode-ai\/cli-darwin-x64\": \"[0-9.]*\"/\"@ccode-ai\/cli-darwin-x64\": \"${VER}\"/" npm/ccode-cli/package.json
          sed -i "s/\"@ccode-ai\/cli-linux-arm64\": \"[0-9.]*\"/\"@ccode-ai\/cli-linux-arm64\": \"${VER}\"/" npm/ccode-cli/package.json
          sed -i "s/\"@ccode-ai\/cli-linux-x64\": \"[0-9.]*\"/\"@ccode-ai\/cli-linux-x64\": \"${VER}\"/" npm/ccode-cli/package.json

      - name: Publish platform packages
        run: |
          for pkg in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            echo "Publishing @ccode-ai/cli-${pkg}..."
            # 复制二进制到对应平台包
            cp artifacts/ccode-${pkg}/bin/ccode npm/${pkg}/bin/ccode
            chmod +x npm/${pkg}/bin/ccode
            # 发布（dry-run 先预览）
            npm publish npm/${pkg}/ --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: |
          echo "Publishing @ccode-ai/cli..."
          npm publish npm/ccode-cli/ --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}