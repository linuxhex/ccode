name: Version Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/version-check.yml'

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - name: Download ripgrep
        run: |
          curl -sL "https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-aarch64-apple-darwin.tar.gz" -o /tmp/rg.tar.gz
          tar -xzf /tmp/rg.tar.gz -C /tmp
          cp /tmp/ripgrep-15.0.0-aarch64-apple-darwin/rg /tmp/rg
          chmod +x /tmp/rg
      - name: Show versions
        run: |
          rustc --version
          cargo --version
      - name: Add x86_64 target
        run: rustup target add x86_64-apple-darwin

      - name: cargo build --release --target (native aarch64)
        env:
          CCODE_TOOLS_BUNDLE_RG_PATH: /tmp/rg
          CCODE_SHELL_BUNDLE_RG_PATH: /tmp/rg
        run: |
          cargo build --release -p ccode-cli --target aarch64-apple-darwin 2>&1 | tail -20
          echo "EXIT_NATIVE: ${PIPESTATUS[0]}"
        shell: bash

      - name: cargo build --release --target (cross x86_64)
        env:
          CCODE_TOOLS_BUNDLE_RG_PATH: /tmp/rg
          CCODE_SHELL_BUNDLE_RG_PATH: /tmp/rg
        run: |
          cargo build --release -p ccode-cli --target x86_64-apple-darwin 2>&1 | tail -40
          echo "EXIT_CROSS: ${PIPESTATUS[0]}"
        shell: bash
